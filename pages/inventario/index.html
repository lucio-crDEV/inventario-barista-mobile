<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#faf8f3"
  >

  <title>Inventario</title>

  <script src="../../theme.js"></script>

  <link
    rel="stylesheet"
    href="./inventario.css"
  >
  <link rel="stylesheet" href="../../theme.css">
  <link rel="stylesheet" href="/shared/shared.css">
</head>

<body>

  <main class="app">

    <header class="app-header">

      <div class="app-title-row">

        <button
          id="header-back-to-categories"
          class="header-back-button"
          type="button"
          aria-label="Volver"
          hidden
        >

          <span
            class="back-arrow"
            aria-hidden="true"
          >
            ←
          </span>

        </button>


        <h1 id="page-title">
          Inventario
        </h1>

        <button id="header-open-item-drawer" class="header-search-button" type="button" aria-label="Buscar ítems" aria-controls="item-drawer" aria-expanded="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"></circle><path d="m15.5 15.5 5 5"></path></svg></button>

        <button class="theme-toggle settings-toggle" type="button" data-settings-toggle aria-label="Abrir menú de cuenta y ajustes" aria-controls="settings-drawer" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg></button>

      </div>


      <section
        id="progress-bar-container" hidden
        class="progress-bar-container"
        aria-label="Progreso del inventario"
      >

        <div
          id="progress-bar"
          class="progress-bar"
        ></div>


        <div
          id="progress-bar-partial"
          class="progress-bar progress-bar-partial"
        ></div>

      </section>


      <p id="progress-text" hidden>
        0 / 0 contados
      </p>

    </header>


    <section id="app-content" aria-busy="true">
      <div class="loading-state loading-inventory"><p class="loading-label" role="status">Cargando tu inventario…<small data-loading-hint></small></p><div class="skeleton-stack" aria-hidden="true"><div class="skeleton-card"><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-field"></span></div><div class="skeleton-card"><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-field"></span></div><div class="skeleton-card"><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-field"></span></div></div></div>
    </section>

  </main>


  <!-- ======================================================
       MODAL: NUEVO INVENTARIO
       ====================================================== -->

  <div
    id="confirm-modal"
    class="modal-backdrop"
    hidden
  >

    <section
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-modal-title"
    >

      <div class="modal-icon">
        !
      </div>


      <h2 id="confirm-modal-title">
        ¿Comenzar un nuevo inventario?
      </h2>


      <p>
        Se perderá
        <strong>
          todo el progreso del inventario actual en todas las áreas
        </strong>,
        incluyendo cantidades, notas y estados.
      </p>


      <p>
        Esta acción no se puede deshacer.
      </p>


      <div class="modal-actions">

        <button
          id="cancel-new-session"
          class="button button-secondary"
          type="button"
        >
          Cancelar
        </button>


        <button
          id="confirm-new-session"
          class="button button-danger"
          type="button"
        >
          Sí, borrar progreso
        </button>

      </div>

    </section>

  </div>


  <script
    type="module"
    src="./inventario.js"
  ></script>

</body>
</html>
