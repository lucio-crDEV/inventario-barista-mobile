<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#faf8f3"
  >

  <title>Inventario</title>

  <script src="../../theme.js"></script>

  <link
    rel="stylesheet"
    href="./inventario.css"
  >
  <link rel="stylesheet" href="../../theme.css">
</head>

<body>

  <main class="app">

    <header class="app-header">

      <div class="app-title-row">

        <button
          id="header-back-to-categories"
          class="header-back-button"
          type="button"
          aria-label="Volver"
          hidden
        >

          <span
            class="back-arrow"
            aria-hidden="true"
          >
            ←
          </span>

        </button>


        <h1 id="page-title">
          Inventario
        </h1>

        <button id="header-open-item-drawer" class="header-search-button" type="button" aria-label="Buscar ítems" aria-controls="item-drawer" aria-expanded="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"></circle><path d="m15.5 15.5 5 5"></path></svg></button>

        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Activar modo oscuro" title="Activar modo oscuro"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="theme-icon-moon" d="M20.4 15.3A8.5 8.5 0 0 1 8.7 3.6 8.5 8.5 0 1 0 20.4 15.3Z"/><g class="theme-icon-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></g></svg></button>

      </div>


      <section
        id="progress-bar-container"
        class="progress-bar-container"
        aria-label="Progreso del inventario"
      >

        <div
          id="progress-bar"
          class="progress-bar"
        ></div>


        <div
          id="progress-bar-partial"
          class="progress-bar progress-bar-partial"
        ></div>

      </section>


      <p id="progress-text">
        0 / 0 contados
      </p>

    </header>


    <section id="app-content">
      <!-- Contenido generado por inventario.js -->
    </section>

  </main>


  <!-- ======================================================
       MODAL: NUEVO INVENTARIO
       ====================================================== -->

  <div
    id="confirm-modal"
    class="modal-backdrop"
    hidden
  >

    <section
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-modal-title"
    >

      <div class="modal-icon">
        !
      </div>


      <h2 id="confirm-modal-title">
        ¿Comenzar un nuevo inventario?
      </h2>


      <p>
        Se perderá
        <strong>
          todo el progreso del inventario actual en todas las áreas
        </strong>,
        incluyendo cantidades, notas y estados.
      </p>


      <p>
        Esta acción no se puede deshacer.
      </p>


      <div class="modal-actions">

        <button
          id="cancel-new-session"
          class="button button-secondary"
          type="button"
        >
          Cancelar
        </button>


        <button
          id="confirm-new-session"
          class="button button-danger"
          type="button"
        >
          Sí, borrar progreso
        </button>

      </div>

    </section>

  </div>


  <script
    type="module"
    src="./inventario.js"
  ></script>

</body>
</html>
