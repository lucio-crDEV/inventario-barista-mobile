<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f3" />
    <title>Panel de supervisión · Inventario</title>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/shared/shared.css" />
    <link rel="stylesheet" href="./supervision.css" />
    <link rel="stylesheet" href="/shared/revision.css" />
    <link rel="stylesheet" href="/shared/inventory-context.css" />
  </head>
  <body class="shared-view">
    <main class="admin">
      <header class="view-header">
        <a class="header-back-button" href="/" aria-label="Volver al inventario"
          ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7" /></svg
        ></a>
        <h1>Panel de supervisión</h1>
        <button
          class="theme-toggle settings-toggle"
          type="button"
          data-settings-toggle
          aria-label="Abrir menú de cuenta y ajustes"
          aria-controls="settings-drawer"
          aria-expanded="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3" y="3" width="7.5" height="7.5" rx="2" />
            <rect x="13.5" y="3" width="7.5" height="7.5" rx="2" />
            <rect x="3" y="13.5" width="7.5" height="7.5" rx="2" />
            <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2" />
          </svg>
        </button>
      </header>
      <p id="message" role="status" tabindex="-1" class="feedback-message" hidden></p>
      <section id="supervision" aria-busy="true">
        <div class="loading-state">
          <p class="loading-label" role="status">Cargando supervisión…</p>
          <div class="skeleton-stack" aria-hidden="true">
            <div class="skeleton-card">
              <span class="skeleton skeleton-line"></span
              ><span class="skeleton skeleton-field"></span>
            </div>
            <div class="skeleton-card"><span class="skeleton skeleton-line"></span></div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./supervision-page.js"></script>
  </body>
</html>
