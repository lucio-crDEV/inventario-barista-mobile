<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf8f3" />
    <title>Usuarios y accesos · Inventario</title>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/shared/shared.css" />
  </head>
  <body class="shared-view">
    <main class="admin">
      <header class="view-header"><a class="header-back-button" href="/" aria-label="Volver al inventario"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></a>
        <h1>Usuarios y accesos</h1>
        <button class="theme-toggle settings-toggle" type="button" data-settings-toggle aria-label="Abrir menú de cuenta y ajustes" aria-controls="settings-drawer" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg></button>
      </header>
      <p class="view-intro">
        Cuentas personales y permisos por área, subárea o zona.
      </p>
      <section id="users" aria-busy="true"><div class="loading-state loading-users"><p class="loading-label" role="status">Cargando cuentas y accesos…<small data-loading-hint></small></p><div class="skeleton-stack" aria-hidden="true"><div class="skeleton-card"><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-field"></span></div><div class="skeleton-card"><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-field"></span></div><div class="skeleton-card"><span class="skeleton skeleton-line"></span><span class="skeleton skeleton-field"></span></div></div></div></section>
      <p
        id="message"
        role="status"
        tabindex="-1"
        class="feedback-message"
        hidden
      ></p>
    </main>
    <script type="module" src="./admin.js"></script>
  </body>
</html>
