<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf8f3" />
    <title>Usuarios y accesos · Inventario</title>
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/shared/shared.css" />
  </head>
  <body class="shared-view">
    <main class="admin">
      <header class="view-header">
        <h1>Usuarios y accesos</h1>
        <button
          class="theme-toggle"
          type="button"
          data-theme-toggle
          aria-label="Activar modo oscuro"
          title="Activar modo oscuro"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              class="theme-icon-moon"
              d="M20.4 15.3A8.5 8.5 0 0 1 8.7 3.6 8.5 8.5 0 1 0 20.4 15.3Z"
            />
            <g class="theme-icon-sun">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
              />
            </g>
          </svg>
        </button>
      </header>
      <a class="back-link" href="/">← Volver al inventario</a>
      <p class="view-intro">
        Cuentas personales y permisos por área, subárea o zona.
      </p>
      <section id="users" aria-busy="true"><p>Consultando cuentas…</p></section>
      <p
        id="message"
        role="status"
        tabindex="-1"
        class="feedback-message"
        hidden
      ></p>
    </main>
    <script type="module" src="./admin.js"></script>
  </body>
</html>
