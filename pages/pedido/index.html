<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <!-- xd -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f5f5f5"
  >

  <title>Pedido a Bodega</title>

  <link
    rel="stylesheet"
    href="./pedido.css"
  >
</head>

<body>

  <main class="app">

    <header class="warehouse-app-header">

      <div class="warehouse-header-row">

        <button
          id="header-back"
          class="warehouse-header-back"
          type="button"
          aria-label="Volver"
        >

          <span aria-hidden="true">
            ←
          </span>

        </button>


        <h1 id="page-title">
          Pedido a Bodega
        </h1>

      </div>


      <div class="warehouse-search-wrap">

        <input
          id="global-search"
          class="warehouse-search"
          type="search"
          inputmode="search"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="Buscar producto…"
          aria-label="Buscar producto"
        >

        <button
          id="clear-search"
          class="warehouse-search-clear"
          type="button"
          aria-label="Limpiar búsqueda"
          hidden
        >
          ×
        </button>

      </div>

    </header>


    <section id="app-content">
      <!-- Contenido generado por pedido.js -->
    </section>

  </main>


  <!-- ======================================================
       MODAL: LIMPIAR PEDIDO
       ====================================================== -->

  <div
    id="clear-order-modal"
    class="modal-backdrop"
    hidden
  >

    <section
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="clear-order-modal-title"
    >

      <div
        class="modal-icon"
        aria-hidden="true"
      >
        !
      </div>


      <h2 id="clear-order-modal-title">
        ¿Limpiar pedido actual?
      </h2>


      <p>
        Se perderá
        <strong>
          todo el contenido del pedido actual
        </strong>,
        incluyendo cantidades y responsable.
      </p>


      <p>
        Esta acción no se puede deshacer.
      </p>


      <div class="modal-actions">

        <button
          id="cancel-clear-order"
          class="warehouse-button warehouse-button-secondary"
          type="button"
        >
          Cancelar
        </button>


        <button
          id="confirm-clear-order"
          class="warehouse-button warehouse-button-danger"
          type="button"
        >
          Sí, limpiar pedido
        </button>

      </div>

    </section>

  </div>


  <!-- ======================================================
       PEDIDO ACTUAL
       ====================================================== -->

  <div class="warehouse-order-bar">

    <button
      id="current-order-button"
      type="button"
    >

      📝 Pedido actual —

      <span id="current-order-count">
        0
      </span>

      ítems

    </button>

  </div>


  <script
    type="module"
    src="./pedido.js"
  ></script>

</body>
</html>
