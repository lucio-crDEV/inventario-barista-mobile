<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e9e9ec">
  <title>Inventario</title>
  <script src="./theme.js"></script>
  <style>
    * { box-sizing: border-box; }
    :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #222; background: #f5f5f5; }
    body { margin: 0; min-height: 100dvh; }
    main { width: min(100% - 32px, 720px); margin: 0 auto; padding: calc(32px + env(safe-area-inset-top)) 0 calc(32px + env(safe-area-inset-bottom)); }
    h1 { margin: 8px 0 6px; text-align: center; font-size: 1.65rem; }
    p { margin: 0 0 26px; text-align: center; color: #666; }
    nav { display: grid; gap: 12px; }
    a { display: flex; align-items: center; justify-content: space-between; min-height: 74px; padding: 16px 20px; border: 1px solid #ddd; border-radius: 14px; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / 4%); color: inherit; text-decoration: none; font-size: 1.08rem; font-weight: 700; -webkit-tap-highlight-color: transparent; }
    a:focus-visible { outline: 3px solid #777; outline-offset: 2px; }
    a:active { transform: scale(.99); }
    .arrow { color: #777; font-size: 1.4rem; }
  </style>
  <link rel="stylesheet" href="./theme.css">
</head>
<body>
  <main>
    <div class="home-header">
      <h1>Inventario</h1>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Activar modo oscuro" title="Activar modo oscuro"><span aria-hidden="true"></span></button>
    </div>
    <nav aria-label="Áreas de inventario">
      <a href="./pages/inventario/?area=cocina">Cocina <span class="arrow" aria-hidden="true">›</span></a>
      <a href="./pages/inventario/?area=panaderia">Panadería <span class="arrow" aria-hidden="true">›</span></a>
      <a href="./pages/inventario/?area=pasteleria">Pastelería <span class="arrow" aria-hidden="true">›</span></a>
      <a href="./pages/inventario/?area=servicio">Servicio <span class="arrow" aria-hidden="true">›</span></a>
      <a href="./pages/inventario/?area=principal">Bodega / Principal <span class="arrow" aria-hidden="true">›</span></a>
    </nav>
  </main>
</body>
</html>
